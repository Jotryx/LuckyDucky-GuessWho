  <g fill="rgb(54,49,148)">
    <polygon points="100,0 200,100 100,200 0,100"/>
    <polygon points="300,0 400,100 300,200 200,100"/>
    <polygon points="100,200 200,300 100,400 0,300"/>
    <polygon points="300,200 400,300 300,400 200,300"/>
  </g>
  <g transform="translate(100 100)" fill="rgb(66,64,182)">
    <circle r="32.5" fill="none" stroke="rgb(66,64,182)" stroke-width="5.5"/>
    <path d="M-16 5 L-17.5 -8.5 L-8 -1.5 L0 -12.5 L8 -1.5 L17.5 -8.5 L16 5 Z"/>
    <rect x="-15.5" y="8" width="31" height="5" rx="2.2"/>
