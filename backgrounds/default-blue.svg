    <circle cx="17.5" cy="-10" r="2.5"/>
  </g>
  <g transform="translate(300 300)">
    <path d="M-19 -19 L19 -19 L31 -6.5 L0 26 L-31 -6.5 Z" fill="rgb(66,64,182)"/>
    <path d="M-31 -6.5 H31 M-19 -19 L-11 -6.5 L0 26 L11 -6.5 L19 -19 M-11 -6.5 L0 -19 L11 -6.5"
