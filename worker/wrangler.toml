# Cloudflare Worker that collects anonymous game stats for Cookie Run Guess Who.
# Setup steps are in worker/README.md.
name = "guesswho-stats"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "guesswho-stats"
database_id = "bf2cb9e6-7fbc-458c-a66e-bc872128411a"   # from: npx wrangler d1 create guesswho-stats

# Cloudflare's built-in rate limiter: counts per connection in memory for a minute, nothing is stored.
[[ratelimits]]
name = "NEW_PLAYERS"        # new player passes per connection per minute
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "EVENT_LIMIT"        # event batches per connection per minute (a busy player sends ~12)
namespace_id = "1002"
simple = { limit = 120, period = 60 }
